<!doctype html>
<html>
<head><meta charset="utf-8"><title>kn5 → glb proof</title>
<style>html,body{margin:0;height:100%;background:#12141a;overflow:hidden}
#tag{position:fixed;left:12px;top:10px;font:13px ui-monospace,monospace;color:#e0a33a;z-index:2}</style></head>
<body>
<div id="tag">kn5 → glb proof — rt_fuji_speedway.kn5 · ROAD_VISUAL + ROAD_PSX + CONCRETE_ROAD + KERB_* (12 meshes, 53k verts)</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12141a);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 2, 1); scene.add(sun);
scene.add(new THREE.GridHelper(4000, 40, 0x2a2f38, 0x1c2028));

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);

new GLTFLoader().load("/road_ac.glb", (gltf) => {
  const root = gltf.scene;
  const mat = new THREE.MeshStandardMaterial({ color: 0xc07820, roughness: 0.85, metalness: 0.0, side: THREE.DoubleSide, flatShading: true });
  root.traverse((o) => { if (o.isMesh) o.material = mat; });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.z);
  controls.target.copy(c);
  camera.position.set(c.x + r * 0.15, c.y + r * 0.75, c.z + r * 0.55);
  camera.near = r / 500; camera.far = r * 20; camera.updateProjectionMatrix();
  controls.update();
  window.__loaded = { verts: countVerts(root), box: [s.x, s.y, s.z].map(Math.round) };
  console.log("LOADED", JSON.stringify(window.__loaded));
}, undefined, (e) => { console.error("GLB LOAD ERROR", e); window.__loaded = { error: String(e) }; });

function countVerts(root){ let n=0; root.traverse(o=>{ if(o.isMesh) n += o.geometry.attributes.position.count; }); return n; }

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
